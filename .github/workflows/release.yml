name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    uses: fredrir/infra/.github/workflows/rust-release.yml@d9016b2889c88f1ec99bfe9d7262343a759e4b69

name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    uses: fredrir/infra/.github/workflows/rust-release.yml@8937e81304136e9edaf236a8ca59bf971cf2c7dd

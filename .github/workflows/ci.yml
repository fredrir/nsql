name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@eb764b837d1fd10cb71fde1963500854aaef5d6c
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL

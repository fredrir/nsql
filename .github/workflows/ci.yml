name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@76dbc83616a77ce14a8307413286de1b17a914aa
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@c288dcde61a3f3fc398ae93ff703a577f969dfbd
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL

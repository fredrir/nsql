name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@f44c0e6b90d5e3e1d62a202924b6ab1d0d34ecdd
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@47f4a2628d9115a451f3e8444bbabacaa28cbf8e
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL

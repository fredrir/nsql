name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    uses: fredrir/infra/.github/workflows/rust-ci.yml@ca94d69c9751fed555f14be14ec341b15e127e38
    with:
      postgres: true
      postgres-url-env: NSQL_TEST_PG_URL
